name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]   # срабатывает при пуше в main
  workflow_dispatch:       # можно запускать вручную

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/front   # папка с вашим сайтом
          publish_branch: gh-pages   # ветка, куда публикуем
          force_orphan: true         # полностью перезаписывает ветку
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'